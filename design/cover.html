<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What to Eat — initial project cover</title>
  <style>
    /* 这是固定尺寸的分享封面画布，不是最终响应式网站页面。 */
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd8cb; }
    .poster { width: 1200px; height: 630px; padding: 64px 78px; position: relative; overflow: hidden; background: #f7f3e8; color: #193f35; font-family: 'Segoe UI', Arial, sans-serif; }
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; letter-spacing: 3px; }
    .mark { border: 1px solid #193f35; border-radius: 50%; padding: 12px; letter-spacing: 0; }
    /* Flexbox 把文字与插图横向排列；封面固定尺寸，手机预览见 preview.html。 */
    .content { display: flex; align-items: center; gap: 40px; margin-top: 40px; }
    .words { width: 590px; }
    h1 { font-family: Georgia, serif; font-size: 100px; font-weight: 400; line-height: .98; letter-spacing: -5px; margin: 0 0 26px; }
    /* 只强调 Eat，让缩略图里也容易识别网站主题。 */
    h1 em { color: #ba4327; font-weight: 400; }
    p { font-size: 23px; line-height: 1.5; margin: 0; max-width: 570px; }
    svg { width: 340px; height: 340px; flex-shrink: 0; transform: rotate(-9deg); }
    .bottom { position: absolute; left: 78px; right: 78px; bottom: 42px; border-top: 1px solid #c8cebe; padding-top: 18px; font-size: 13px; letter-spacing: 2px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <main class="poster" aria-label="What to Eat project cover">
    <div class="top"><span>A LITTLE HELP WITH LUNCH</span><span class="mark">W/E</span></div>
    <div class="content">
      <div class="words">
        <h1>What to <em>Eat.</em></h1>
        <p>A simple meal picker helping students choose what to eat by budget and taste.</p>
      </div>
      <!-- 用基本几何图形绘制餐盘，保留可读源代码，没有引用外部照片。 -->
      <svg viewBox="0 0 340 340" role="img" aria-label="An illustrated plate with rice, vegetables and an egg">
        <circle cx="170" cy="170" r="165" fill="#e8e4d7"/>
        <circle cx="164" cy="160" r="154" fill="#fffdf7" stroke="#193f35" stroke-width="2"/>
        <circle cx="164" cy="160" r="123" fill="#f2eddf" stroke="#b9c6b3"/>
        <path d="M67 178 Q68 80 155 75 Q221 78 221 168 Q208 240 143 251 Q76 245 67 178" fill="#e6b966"/>
        <path d="M98 135l12 8m12-35 10 8m19 30 12 7m-60 38 12 6m31 22 12 6m21-51 9 8m-55 39 10 7" stroke="#fff9e8" stroke-width="5" stroke-linecap="round"/>
        <g fill="#477855" stroke="#193f35" stroke-width="2"><ellipse cx="242" cy="132" rx="23" ry="44" transform="rotate(27 242 132)"/><ellipse cx="247" cy="195" rx="23" ry="43" transform="rotate(66 247 195)"/></g>
        <path d="M135 128 Q111 83 158 77 Q178 49 205 78 Q249 91 226 127 Q233 163 192 165 Q159 183 141 157Z" fill="#fffef8" stroke="#d8d0b8" stroke-width="2"/>
        <circle cx="184" cy="119" r="27" fill="#e7a334"/><circle cx="176" cy="111" r="8" fill="#f6c65f"/>
        <g fill="#ba4327"><circle cx="218" cy="242" r="14"/><circle cx="191" cy="251" r="12"/></g>
      </svg>
    </div>
    <div class="bottom"><span>YOUR BUDGET. YOUR TASTE.</span><span>ONE LESS DECISION.</span></div>
  </main>
</body>
</html>
