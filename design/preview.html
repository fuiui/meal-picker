<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么 · 第二部分封面预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f3e8; color: #193f35; font: 16px/1.7 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 32px 20px; }
    .label { color: #ba4327; font-size: 13px; letter-spacing: 2px; }
    h1 { font-size: clamp(26px, 5vw, 40px); margin: 8px 0; line-height: 1.3; }
    h2 { font-size: 20px; }
    figure { margin: 24px 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d8d5c8; }
    figcaption { margin-top: 8px; color: #516458; font-size: 14px; }
    .small { width: 300px; max-width: 100%; }
    .swatches { display: flex; flex-wrap: wrap; gap: 14px; }
    .swatches span { padding: 10px 16px; border: 1px solid #b9c6b3; border-radius: 6px; }
    .green { background: #193f35; color: white; }
    .orange { background: #ba4327; color: white; }
    a { color: #91331d; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #193f35; outline-offset: 4px; }
    footer { margin-top: 32px; border-top: 1px solid #c8cebe; padding-top: 16px; }
  </style>
</head>
<body>
  <main>
    <p class="label">WHAT TO EAT / PART 02</p>
    <h1>先给网站一个清楚的样子。</h1>
    <p>这是个人项目的初始分享封面，不是四页网站的首页。标题、配色和餐盘图形将为后续页面提供设计方向。</p>
    <figure>
      <img src="../images/og-image.jpg" width="1200" height="630" alt="What to Eat 封面：奶油色背景，深绿色标题，橘红色 Eat，右侧为米饭、鸡蛋和蔬菜组成的餐盘插图。">
      <figcaption>初始封面 · 1200 × 630 像素 · JPG · 小于 100 KB</figcaption>
    </figure>
    <h2>缩小后是否还能读懂？</h2>
    <figure class="small">
      <img src="../images/og-image.jpg" width="1200" height="630" alt="宽 300 像素的封面缩略图，用于检查网站名称是否仍然可读。">
      <figcaption>300 像素宽预览：优先看清名称和食物主题。</figcaption>
    </figure>
    <h2>三种主色</h2>
    <div class="swatches"><span>奶油色 #F7F3E8</span><span class="green">深绿色 #193F35</span><span class="orange">橘红色 #BA4327</span></div>
    <h2>为什么这样设计？</h2>
    <p>浅色底让内容清楚，深绿色用于主要文字，橘红色突出“吃”这个主题。餐盘用简单图形表示食物，不暗示我们已经接入真实餐厅或外卖服务。</p>
    <footer>
      <a href="cover.html">查看封面源页面</a> · <a href="og-image-v1.jpg">查看保留的最初草稿</a> · <a href="../images/og-image.jpg" download>下载当前封面</a>
      <p>当前只完成选题规划与初始封面，保存在本地 Git 中，尚未上传。推荐功能将在后续部分制作。</p>
    </footer>
  </main>
</body>
</html>
