<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse twenty-four illustrated meals and filter by food type and mealtime.">
  <title>Meal Collection | What to Eat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Meal Collection | What to Eat">
  <meta property="og:description" content="Browse twenty-four illustrated meals and filter by food type and mealtime.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://fuiui.github.io/meal-picker/meals.html">
  <meta property="og:image" content="https://fuiui.github.io/meal-picker/images/og-image.jpg">
</head>
<body class="collection">
  <a href="#main-content">Skip to main content</a>
  <header>
    <p><strong>What to Eat</strong></p>
    <nav aria-label="Main navigation"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="pick.html">Pick a Meal</a></li>
      <li><a href="meals.html" aria-current="page">Meal Collection</a></li>
      <li><a href="about.html">About</a></li>
    </ul></nav>
  </header>
  <main id="main-content" tabindex="-1">
    <h1>Meal Collection</h1>
    <p>Twenty-four ideas for your next meal. Explore by food type and mealtime, or let the random picker choose.</p>
    <p><a href="pick.html">Let the picker choose for me</a></p>
    <!-- 数据只保存在 meals.js，这里由脚本生成卡片，避免手写两份菜单。 -->
    <form id="browse-form" class="browse-filters">
      <p><label for="browse-category">Food type</label><select id="browse-category"><option value="any">Any food type</option><option value="rice">Rice &amp; congee</option><option value="noodles">Noodles</option><option value="dumplings">Dumplings &amp; buns</option><option value="hotpot">Hotpot &amp; mixed pots</option><option value="light">Light meals</option><option value="bakery">Bread &amp; wraps</option></select></p>
      <p><label for="browse-occasion">Mealtime</label><select id="browse-occasion"><option value="any">Any mealtime</option><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></p>
      <button id="reset-browse" class="secondary" type="button">Show all meals</button>
    </form>
    <p id="collection-count" role="status"></p>
    <div id="meal-list"></div>
    <noscript><p>Enable JavaScript to display the meal collection. You can still read the <a href="about.html">project information</a> and use the navigation.</p></noscript>
  </main>
  <footer><p>What to Eat · A student web project.</p></footer>
  <script src="meals.js"></script>
  <script src="meal-card.js"></script>
  <script src="collection.js"></script>
</body>
</html>
